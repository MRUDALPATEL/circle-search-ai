<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Search — Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>

  <img id="screenshot-bg" alt="" draggable="false" />
  <canvas id="canvas"></canvas>

  <!-- Hint shown while waiting to draw -->
  <div id="hint">
    <div class="hint-brand">
      <span class="brand-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10" cy="10" r="7.5"
            stroke="rgba(150,135,255,0.90)"
            stroke-width="1.6"
            stroke-linecap="round"
            fill="none"
          />
        </svg>
      </span>
      <span class="brand-text">Circle Search <em>· AI</em></span>
    </div>
    <div class="hint-subtitle">
      Draw around anything
      <span class="hint-dot"></span>
      text, images, code, charts
      <span class="hint-dot"></span>
      <kbd>Esc</kbd> to cancel
    </div>
  </div>

  <!-- Question bar shown after circling -->
  <div id="question-bar">
    <div class="qbar-inner">
      <svg class="qbar-icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="7.5" cy="7.5" r="5.5" stroke="white" stroke-width="1.4"/>
        <line x1="11.5" y1="11.5" x2="16" y2="16" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input
        id="question-input"
        type="text"
        placeholder="Ask anything about this… (optional)"
        maxlength="300"
        autocomplete="off"
        spellcheck="false"
      />
      <span id="qbar-counter"></span>
      <button id="qbar-submit">
        <svg viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 6.5h9M7.5 3l4 3.5-4 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Search
      </button>
    </div>
    <div class="qbar-skip">
      <span id="qbar-skip-btn">or press <kbd>Enter</kbd> to search without a question · <kbd>Esc</kbd> to cancel</span>
    </div>
  </div>

  <script type="module" src="./overlay.ts"></script>
</body>
</html>
