<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle Search — Results</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0c0c14;
      color: #e2ddf5;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', 'Inter', sans-serif;
      overflow: hidden;
    }

    #app-shell {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: scale(0.97) translateY(12px);
    }
    #app-shell.enter {
      animation: shell-enter 0.48s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes shell-enter {
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── Title bar ── */
    #titlebar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: 46px;
      background: #0e0e18;
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
      flex-shrink: 0;
    }
    #titlebar-label {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    #titlebar-logo {
      width: 24px; height: 24px;
      border-radius: 6px;
      background: rgba(110,96,240,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #titlebar-logo svg {
      animation: logo-spin 3.5s linear infinite;
      transform-origin: center;
    }
    @keyframes logo-spin { to { transform: rotate(360deg); } }
    .titlebar-name {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.72);
    }
    .titlebar-badge {
      font-size: 10.5px;
      font-weight: 500;
      color: rgba(140,125,255,0.80);
      background: rgba(110,96,240,0.18);
      border: 0.5px solid rgba(110,96,240,0.3);
      border-radius: 999px;
      padding: 2px 8px;
    }
    #titlebar-actions {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .title-btn {
      background: none;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.14s, color 0.14s;
      height: 28px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #copy-btn {
      color: rgba(140,125,255,0.85);
      border: 0.5px solid rgba(110,96,240,0.35);
    }
    #copy-btn:hover { background: rgba(110,96,240,0.16); }
    #copy-btn.copied {
      color: rgba(74,222,128,0.9);
      border-color: rgba(74,222,128,0.3);
    }
    #close-btn {
      color: rgba(255,255,255,0.3);
      font-size: 16px;
      padding: 0 8px;
    }
    #close-btn:hover {
      background: rgba(255,255,255,0.07);
      color: rgba(255,255,255,0.7);
    }

    /* ── Main scrollable area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Loading (initial) ── */
    #loading-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 5;
    }
    .pulse-rings {
      position: relative;
      width: 56px; height: 56px;
      display: flex; align-items: center; justify-content: center;
    }
    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(110,96,240,0.5);
      width: 56px; height: 56px;
      animation: pulse-expand 1.8s ease-out infinite;
    }
    .pulse-ring:nth-child(2) { animation-delay: 0.5s; }
    .pulse-ring:nth-child(3) { animation-delay: 1.0s; }
    @keyframes pulse-expand {
      0%   { transform: scale(0.4); opacity: 0.8; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    .pulse-core {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(110,96,240,0.18);
      border: 1.5px solid rgba(140,125,255,0.6);
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .loading-text {
      font-size: 13.5px;
      color: rgba(255,255,255,0.45);
      font-weight: 500;
    }
    .loading-dots::after {
      content: '';
      animation: dots 1.5s steps(3,end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }
    .loading-skeleton {
      width: 300px;
      display: flex; flex-direction: column; gap: 9px;
      margin-top: 6px;
    }
    .skel-line {
      height: 10px; border-radius: 5px;
      background: linear-gradient(90deg,rgba(255,255,255,0.04) 0%,rgba(255,255,255,0.09) 50%,rgba(255,255,255,0.04) 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s ease-in-out infinite;
    }
    .skel-line:nth-child(1){width:100%;} .skel-line:nth-child(2){width:82%;}
    .skel-line:nth-child(3){width:91%;} .skel-line:nth-child(4){width:67%;}
    @keyframes shimmer {
      0%  { background-position: 200% 0; }
      100%{ background-position: -200% 0; }
    }

    /* ── Chat thread ── */
    #chat-thread {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 8px;
      flex-direction: column;
      gap: 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(110,96,240,0.25) transparent;
    }
    #chat-thread.visible {
      display: flex;
      animation: result-enter 0.42s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes result-enter {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #chat-thread::-webkit-scrollbar { width: 3px; }
    #chat-thread::-webkit-scrollbar-thumb {
      background: rgba(110,96,240,0.3);
      border-radius: 2px;
    }

    /* Message bubbles */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: msg-in 0.32s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* User question bubble */
    .msg-user {
      align-items: flex-end;
    }
    .msg-user .bubble {
      background: rgba(110,96,240,0.22);
      border: 0.5px solid rgba(110,96,240,0.4);
      border-radius: 14px 14px 4px 14px;
      padding: 9px 13px;
      font-size: 13px;
      color: rgba(220,210,255,0.92);
      max-width: 85%;
      line-height: 1.5;
    }

    /* AI response bubble */
    .msg-ai {
      align-items: flex-start;
    }
    .msg-ai-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
      padding-left: 2px;
    }
    .msg-ai-icon {
      width: 18px; height: 18px;
      border-radius: 5px;
      background: rgba(110,96,240,0.2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .msg-ai-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(140,125,255,0.7);
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }
    .msg-ai .bubble {
      background: rgba(255,255,255,0.04);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 4px 14px 14px 14px;
      padding: 12px 14px;
      font-size: 13.5px;
      color: #d8d3f0;
      line-height: 1.72;
      width: 100%;
    }

    /* Markdown inside bubbles */
    .bubble h1,.bubble h2,.bubble h3 {
      color: rgba(255,255,255,0.92);
      font-weight: 600;
      margin: 14px 0 6px;
      line-height: 1.4;
    }
    .bubble h1{font-size:15px;} .bubble h2{font-size:14px;} .bubble h3{font-size:13.5px;color:rgba(255,255,255,0.78);}
    .bubble p { margin-bottom: 9px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble code {
      background: rgba(110,96,240,0.14);
      border: 0.5px solid rgba(110,96,240,0.28);
      color: #c4b5fd;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: 'Fira Code','Consolas',monospace;
      font-size: 12px;
    }
    .bubble pre {
      background: rgba(0,0,0,0.38);
      border: 0.5px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 9px 0;
    }
    .bubble pre code {
      background: none; border: none; padding: 0;
      color: #e0d8f8; font-size: 12.5px;
    }
    .bubble ul,.bubble ol { padding-left: 17px; margin-bottom: 9px; }
    .bubble li { margin-bottom: 3px; }
    .bubble strong { color: rgba(255,255,255,0.9); font-weight: 600; }
    .bubble em { color: rgba(255,255,255,0.65); font-style: italic; }
    .bubble hr { border: none; border-top: 0.5px solid rgba(255,255,255,0.07); margin: 12px 0; }
    .bubble blockquote {
      border-left: 2px solid rgba(110,96,240,0.5);
      padding: 3px 10px;
      color: rgba(255,255,255,0.5);
      margin: 8px 0;
      font-style: italic;
    }

    /* Inline loading bubble for follow-up */
    .msg-loading .bubble {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
    }
    .typing-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(140,125,255,0.6);
      animation: typing-bounce 1.1s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes typing-bounce {
      0%,80%,100% { transform: translateY(0); opacity: 0.4; }
      40%          { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Error state ── */
    #error-state {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      z-index: 5;
    }
    #error-state.visible {
      display: flex;
      animation: result-enter 0.42s cubic-bezier(0.22,1,0.36,1) both;
    }
    .error-icon-wrap {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(239,68,68,0.1);
      border: 0.5px solid rgba(239,68,68,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .error-title { font-size: 14px; font-weight: 600; color: rgba(252,165,165,0.9); }
    #error-message { font-size: 12.5px; color: rgba(255,255,255,0.38); max-width: 340px; line-height: 1.6; }
    #retry-hint {
      margin-top: 6px; font-size: 11.5px; color: rgba(255,255,255,0.22);
      display: flex; align-items: center; gap: 5px;
    }
    #retry-hint kbd {
      background: rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.14);
      border-radius: 4px; padding: 1px 6px;
      font-family: inherit; font-size: 11px; color: rgba(255,255,255,0.32);
    }

    /* ── Follow-up input bar ── */
    #followup-bar {
      flex-shrink: 0;
      padding: 10px 12px 12px;
      border-top: 0.5px solid rgba(255,255,255,0.07);
      display: none;
    }
    #followup-bar.visible { display: block; }

    .fbar-inner {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px 8px 8px 13px;
      transition: border-color 0.15s;
    }
    .fbar-inner:focus-within {
      border-color: rgba(110,96,240,0.5);
      box-shadow: 0 0 0 2px rgba(110,96,240,0.1);
    }

    #followup-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: rgba(255,255,255,0.88);
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.5;
      resize: none;
      min-height: 20px;
      max-height: 96px;
      overflow-y: auto;
      caret-color: rgba(140,125,255,0.9);
      scrollbar-width: none;
    }
    #followup-input::placeholder { color: rgba(255,255,255,0.24); }
    #followup-input::-webkit-scrollbar { display: none; }

    #followup-send {
      flex-shrink: 0;
      width: 32px; height: 32px;
      border-radius: 9px;
      border: none;
      background: rgba(110,96,240,0.3);
      color: rgba(180,168,255,0.9);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, opacity 0.15s;
      align-self: flex-end;
    }
    #followup-send:hover:not(:disabled) { background: rgba(110,96,240,0.5); }
    #followup-send:disabled { opacity: 0.35; cursor: default; }
    #followup-send svg { width: 14px; height: 14px; }

    .fbar-hint {
      font-size: 10.5px;
      color: rgba(255,255,255,0.18);
      margin-top: 5px;
      padding: 0 4px;
    }
    .fbar-hint kbd {
      background: rgba(255,255,255,0.07);
      border: 0.5px solid rgba(255,255,255,0.12);
      border-radius: 3px;
      padding: 0 4px;
      font-family: inherit;
      font-size: 10px;
      color: rgba(255,255,255,0.28);
    }

    /* ── Footer ── */
    #footer {
      padding: 7px 14px;
      border-top: 0.5px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #footer-brand {
      font-size: 11px;
      color: rgba(255,255,255,0.16);
      display: flex; align-items: center; gap: 5px;
    }
    #timestamp { font-size: 11px; color: rgba(255,255,255,0.16); }
  </style>
</head>
<body>
<div id="app-shell">

  <!-- Title bar -->
  <div id="titlebar">
    <div id="titlebar-label">
      <div id="titlebar-logo">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="7" cy="7" r="5.5" stroke="rgba(150,135,255,0.85)" stroke-width="1.4"
            stroke-dasharray="10 5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="titlebar-name">Circle Search</span>
      <span class="titlebar-badge">Gemini</span>
    </div>
    <div id="titlebar-actions">
      <button class="title-btn" id="copy-btn">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <rect x="4" y="4" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.1"/>
          <path d="M3 8H2.5A1.5 1.5 0 0 1 1 6.5v-4A1.5 1.5 0 0 1 2.5 1h4A1.5 1.5 0 0 1 8 2.5V3"
            stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        Copy
      </button>
      <button class="title-btn" id="close-btn">✕</button>
    </div>
  </div>

  <!-- Main -->
  <div id="main">

    <!-- Initial loading -->
    <div id="loading-state">
      <div class="pulse-rings">
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-core">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="5" cy="5" r="3.5" stroke="rgba(150,135,255,0.85)" stroke-width="1.2"/>
            <line x1="8" y1="8" x2="11" y2="11" stroke="rgba(150,135,255,0.85)" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <span class="loading-text">Analyzing with Gemini<span class="loading-dots"></span></span>
      <div class="loading-skeleton">
        <div class="skel-line"></div>
        <div class="skel-line"></div>
        <div class="skel-line"></div>
        <div class="skel-line"></div>
      </div>
    </div>

    <!-- Chat thread -->
    <div id="chat-thread"></div>

    <!-- Error -->
    <div id="error-state">
      <div class="error-icon-wrap">⚠️</div>
      <div class="error-title">Analysis failed</div>
      <div id="error-message"></div>
      <div id="retry-hint">Press <kbd>Alt+Space</kbd> and try again</div>
    </div>

  </div>

  <!-- Follow-up input -->
  <div id="followup-bar">
    <div class="fbar-inner">
      <textarea
        id="followup-input"
        placeholder="Ask a follow-up question…"
        rows="1"
        maxlength="600"
      ></textarea>
      <button id="followup-send" disabled>
        <svg viewBox="0 0 14 14" fill="none">
          <path d="M2 7h10M7.5 3l5 4-5 4" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="fbar-hint"><kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</div>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span id="footer-brand">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <circle cx="5" cy="5" r="4" stroke="rgba(150,135,255,0.5)" stroke-width="1"/>
      </svg>
      Powered by Gemini Vision
    </span>
  </div>

</div>

<script type="module" src="./results.ts"></script>
</body>
</html>
